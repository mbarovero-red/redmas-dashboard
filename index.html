<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dashboard Operativo RED+</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --azul: #0047BA;
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --texto: #1F2933;
    --texto-sec: #6B7785;
    --borde: #E4E7EB;
    --verde: #1E8E5A;
    --rojo: #C0392B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font-family: -apple-system, "Segoe UI", Roboto, Calibri, Arial, sans-serif;
  }
  header {
    background: #fff; border-bottom: 1px solid var(--borde);
    padding: 16px 24px; display: flex; align-items: center; gap: 16px;
  }
  header img { height: 34px; }
  header .titulo { font-size: 1.05rem; font-weight: 700; color: var(--azul); }
  header .fecha { margin-left: auto; font-size: 0.85rem; color: var(--texto-sec); text-align: right; }
  nav.tabs {
    background: #fff; border-bottom: 1px solid var(--borde);
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 4px; padding: 0 16px; overflow-x: auto;
  }
  nav.tabs button {
    border: none; background: transparent; cursor: pointer;
    padding: 12px 14px; font-size: 0.85rem; font-weight: 600; color: var(--texto-sec);
    border-bottom: 3px solid transparent; white-space: nowrap;
  }
  nav.tabs button:hover { color: var(--azul); }
  nav.tabs button.active { color: var(--azul); border-bottom-color: var(--azul); }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  h2 { font-size: 1rem; color: var(--azul); margin: 32px 0 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--borde); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { font-size: 0.75rem; color: var(--texto-sec); margin-bottom: 4px; }
  .kpi .valor { font-size: 1.35rem; font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--borde); border-radius: 10px; padding: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  .nota { font-size: 0.8rem; color: var(--texto-sec); margin-top: 6px; }
  canvas { max-height: 300px; }
  .hist-mes { margin-bottom: 12px; }
  .hist-mes .titulo-mes { font-weight: 600; margin-bottom: 8px; }
  table.tbl-historico { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.tbl-historico th, table.tbl-historico td { padding: 5px 8px; text-align: right; white-space: nowrap; }
  table.tbl-historico th:first-child, table.tbl-historico td:first-child { text-align: left; }
  table.tbl-historico thead th { color: var(--texto-sec); font-weight: 600; font-size: 0.72rem; border-bottom: 2px solid var(--borde); }
  table.tbl-historico tbody tr { border-bottom: 1px solid var(--borde); }
  table.tbl-historico tr.total td { font-weight: 700; border-top: 2px solid var(--azul); border-bottom: none; }
  footer { text-align: center; color: var(--texto-sec); font-size: 0.75rem; padding: 24px; }
</style>
</head>

function fmtMillones(v) {
  if (v === null || v === undefined) return "--";
  return "$" + (v / 1e6).toLocaleString("es-AR", {maximumFractionDigits: 1}) + "M";
}
function fmtPct(v) {
  if (v === null || v === undefined) return "--";
  return v.toLocaleString("es-AR", {maximumFractionDigits: 1}) + "%";
}
function fmtInt(v) {
  if (v === null || v === undefined) return "--";
  return Math.round(v).toLocaleString("es-AR");
}
function fmtMoneda(v) {
  if (v === null || v === undefined) return "--";
  return "$" + Math.round(v).toLocaleString("es-AR");
}

document.getElementById("fecha-actualizacion").textContent = DATA.generated_at;

const chartInstances = {};
const DONUT_COLORS = ["#0047BA", "#70AD47", "#ED7D31", "#9E5CA8", "#C00000", "#FFC000",
  "#4472C4", "#264478", "#997300", "#43682B", "#7030A0", "#548235", "#BF9000", "#375623", "#833C00"];

function panelHtml(tab, idx) {
  return `
    <div class="kpis" id="kpis-${idx}"></div>
    <h2>% Facturado vs Cobranza (Mes Anterior vs Mes Actual)</h2>
    <div class="card"><canvas id="chartFactCobr-${idx}"></canvas></div>
    <h2>Altas y Bajas por servicio — Mes Anterior vs Mes Actual</h2>
    <div class="grid4" id="chartsServicio-${idx}"></div>
    <h2>Instalaciones Pendientes por servicio</h2>
    <div class="card"><canvas id="chartPendientes-${idx}"></canvas></div>
    ${tab.saldo_clientes ? `<h2>Saldo de clientes únicos</h2><div class="kpis" id="saldo-${idx}"></div>` : ""}
    <h2>Resumen de contratos activos</h2>
    <div class="card"><canvas id="chartActivos-${idx}"></canvas></div>
    ${tab.medios_cobro ? `
    <h2>Distribución de medios de cobro (${tab.medios_cobro.fecha_desde} al ${tab.medios_cobro.fecha_hasta}, mes en curso)</h2>
    <div class="card"><canvas id="chartMediosCobro-${idx}"></canvas></div>` : ""}
    ${tab.os_pendientes ? `
    <h2>Trabajos técnicos pendientes (total: ${fmtInt(tab.os_pendientes.total)})</h2>
    <div class="grid2">
      <div class="card"><div style="font-weight:600;margin-bottom:8px;">Por antigüedad</div><canvas id="chartOsAntiguedad-${idx}"></canvas></div>
      <div class="card"><div style="font-weight:600;margin-bottom:8px;">Por ${tab.os_pendientes.grupo_label.toLowerCase()}</div><canvas id="chartOsGrupo-${idx}"></canvas></div>
    </div>` : ""}
    ${tab.historico_cierre ? `
    <h2>Efectividad de cierre — histórico mensual por ${tab.historico_cierre.label_col.toLowerCase()} y tipo (registro permanente, no rotativo)</h2>
    <div id="historico-${idx}"></div>` : ""}
  `;
}

function sugMax(...vals) {
  const m = Math.max(...vals, 0);
  return m > 0 ? m * 1.15 : undefined;
}

function renderPanelCharts(tab, idx) {
  document.getElementById(`kpis-${idx}`).innerHTML = kpisHtml(tab);
  if (tab.saldo_clientes) {
    document.getElementById(`saldo-${idx}`).innerHTML = saldoClientesHtml(tab.saldo_clientes);
  }
  if (tab.historico_cierre) {
    document.getElementById(`historico-${idx}`).innerHTML = historicoCierreHtml(tab.historico_cierre);
  }

  chartInstances[`fc-${idx}`] = new Chart(document.getElementById(`chartFactCobr-${idx}`), {
    type: "bar",
    data: {
      labels: ["Mes Anterior", "Mes Actual (parcial)"],
      datasets: [
        { label: "Facturado", data: [tab.facturado.anterior, tab.facturado.actual], backgroundColor: "#0047BA" },
        { label: "Cobrado", data: [tab.cobrado.anterior, tab.cobrado.actual], backgroundColor: "#70AD47" },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: "bottom" },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtMillones(c.raw)}` } } },
      scales: {
        x: { ticks: { maxRotation: 0, minRotation: 0 } },
        y: { suggestedMax: sugMax(tab.facturado.anterior, tab.facturado.actual, tab.cobrado.anterior, tab.cobrado.actual),
              ticks: { callback: fmtMillones } }
      }
    }
  });

  const contSrv = document.getElementById(`chartsServicio-${idx}`);
  contSrv.innerHTML = "";
  tab.altas_bajas.forEach((s, i) => {
    const nota = s.inferido
      ? `<div class="nota">Inferido de facturación (ítems "Dibox"), no de contrato -- no existe como
         producto/contrato propio en el CRM.</div>`
      : "";
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="card"><div style="font-weight:600;margin-bottom:8px;">${s.servicio}</div><canvas id="chartSrv-${idx}-${i}"></canvas>${nota}</div>`;
    contSrv.appendChild(wrap);
    chartInstances[`srv-${idx}-${i}`] = new Chart(wrap.querySelector("canvas"), {
      type: "bar",
      data: {
        labels: ["Mes Anterior", "Mes Actual"],
        datasets: [
          { label: "Altas", data: [s.altas_anterior, s.altas_actual], backgroundColor: "#70AD47" },
          { label: "Bajas", data: [s.bajas_anterior, s.bajas_actual], backgroundColor: "#C0392B" },
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: "bottom" } },
        scales: {
          x: { ticks: { maxRotation: 0, minRotation: 0 } },
          y: { suggestedMax: sugMax(s.altas_anterior, s.altas_actual, s.bajas_anterior, s.bajas_actual),
                ticks: { precision: 0 } }
        }
      }
    });
  });

  chartInstances[`pend-${idx}`] = new Chart(document.getElementById(`chartPendientes-${idx}`), {
    type: "bar",
    data: {
      labels: tab.pendientes.map(p => p.servicio),
      datasets: [{ label: "Instalaciones Pendientes", data: tab.pendientes.map(p => p.cantidad), backgroundColor: "#0047BA" }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { maxRotation: 0, minRotation: 0 } },
        y: { suggestedMax: sugMax(...tab.pendientes.map(p => p.cantidad)), ticks: { precision: 0 } }
      }
    }
  });

  chartInstances[`activos-${idx}`] = new Chart(document.getElementById(`chartActivos-${idx}`), {
    type: "bar",
    data: {
      labels: tab.activos.map(a => a.servicio),
      datasets: [{ label: "Contratos Activos", data: tab.activos.map(a => a.cantidad), backgroundColor: "#0047BA" }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { maxRotation: 0, minRotation: 0 } },
        y: { suggestedMax: sugMax(...tab.activos.map(a => a.cantidad)), ticks: { precision: 0 } }
      }
    }
  });

  if (tab.os_pendientes) {
    const op = tab.os_pendientes;
    chartInstances[`osant-${idx}`] = new Chart(document.getElementById(`chartOsAntiguedad-${idx}`), {
      type: "bar",
      data: {
        labels: op.antiguedad.map(a => a.bucket),
        datasets: [{ label: "Pendientes", data: op.antiguedad.map(a => a.cantidad), backgroundColor: "#0047BA" }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { maxRotation: 0, minRotation: 0 } },
          y: { suggestedMax: sugMax(...op.antiguedad.map(a => a.cantidad)), ticks: { precision: 0 } }
        }
      }
    });
    chartInstances[`osgrp-${idx}`] = new Chart(document.getElementById(`chartOsGrupo-${idx}`), {
      type: "bar",
      data: {
        labels: op.grupos.map(g => g.grupo),
        datasets: [{ label: "Pendientes", data: op.grupos.map(g => g.cantidad), backgroundColor: "#0047BA" }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { maxRotation: 0, minRotation: 0 } },
          y: { suggestedMax: sugMax(...op.grupos.map(g => g.cantidad)), ticks: { precision: 0 } }
        }
      }
    });
  }

  if (tab.medios_cobro) {
    const mc = tab.medios_cobro;
    chartInstances[`mediocobro-${idx}`] = new Chart(document.getElementById(`chartMediosCobro-${idx}`), {
      type: "doughnut",
      data: {
        labels: mc.segmentos.map(s => s.medio),
        datasets: [{ data: mc.segmentos.map(s => s.monto),
          backgroundColor: mc.segmentos.map((s, i) => DONUT_COLORS[i % DONUT_COLORS.length]) }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: "right" },
          tooltip: { callbacks: { label: c => `${c.label}: ${fmtMillones(c.raw)} (${mc.segmentos[c.dataIndex].pct}%)` } }
        }
      }
    });
  }
}

function saldoClientesHtml(s) {
  const kpis = [
    ["Saldo inicial de clientes (1er día del mes)", fmtInt(s.saldo_inicial)],
    ["Altas (mes, acumulado)", fmtInt(s.altas)],
    ["Recupero (mes, acumulado)", fmtInt(s.recupero)],
    ["Bajas voluntarias (mes, acumulado)", fmtInt(s.bajas_vol)],
    ["Bajas por mora (mes, acumulado)", fmtInt(s.bajas_mora)],
  ];
  if (s.migracion) kpis.push(["Migración (mes, acumulado)", fmtInt(s.migracion)]);
  kpis.push(["Saldo final de clientes (activos a hoy)", fmtInt(s.saldo_final)]);
  return kpis.map(([label, valor]) =>
    `<div class="kpi"><div class="label">${label}</div><div class="valor">${valor}</div></div>`
  ).join("");
}

function historicoCierreHtml(h) {
  if (!h.bloques.length) {
    return `<div class="card"><div class="nota">Sin registros todavía (arranca a acumularse desde julio 2026).</div></div>`;
  }
  return h.bloques.map(b => {
    const filas = b.grupos.map(g =>
      `<tr><td>${g.nombre}</td>${g.valores.map(v => `<td>${fmtInt(v)}</td>`).join("")}<td>${fmtInt(g.total)}</td></tr>`
    ).join("");
    const filaTotal = `<tr class="total"><td>TOTAL</td>${b.totales.map(v => `<td>${fmtInt(v)}</td>`).join("")}<td>${fmtInt(b.total_general)}</td></tr>`;
    return `
      <div class="hist-mes card">
        <div class="titulo-mes">${b.mes}</div>
        <div style="overflow-x:auto;">
        <table class="tbl-historico">
          <thead><tr><th>${h.label_col}</th>${h.tipos.map(t => `<th>${t}</th>`).join("")}<th>Total</th></tr></thead>
          <tbody>${filas}${filaTotal}</tbody>
        </table>
        </div>
      </div>`;
  }).join("");
}

function kpisHtml(tab) {
  const pctCobr = tab.facturado.actual ? (tab.cobrado.actual / tab.facturado.actual) * 100 : null;
  const totalPend = tab.pendientes.reduce((s, p) => s + p.cantidad, 0);
  const kpis = [
    ["Facturado (mes actual)", fmtMillones(tab.facturado.actual)],
  ];
  if (tab.cache_hasta && tab.cobrado_comparativa) {
    const dhLabel = n => n === 1 ? "1 día hábil transcurrido" : `${n} días hábiles transcurridos`;
    const c = tab.cobrado_comparativa;
    kpis.push([`Cobrado (mes actual, al ${c.fecha_actual}) — ${dhLabel(c.dias_habiles_actual)}`,
                fmtMillones(tab.cobrado.actual)]);
    kpis.push([`Cobrado (mes anterior, al mismo día ${c.fecha_anterior}) — ${dhLabel(c.dias_habiles_anterior)}`,
                fmtMillones(c.cobr_anterior)]);
  } else {
    kpis.push(["Cobrado (mes actual, parcial)", fmtMillones(tab.cobrado.actual)]);
  }
  kpis.push(["ARPU residencial (mes)", fmtMoneda(tab.arpu_residencial)]);
  kpis.push(["Churn residencial (mes)", fmtPct(tab.churn_residencial)]);
  kpis.push(["% Cobranza sobre Facturado", fmtPct(pctCobr)]);
  kpis.push(["Instalaciones Pendientes (total)", fmtInt(totalPend)]);
  return kpis.map(([label, valor]) =>
    `<div class="kpi"><div class="label">${label}</div><div class="valor">${valor}</div></div>`
  ).join("");
}

const nav = document.getElementById("tabNav");
const panels = document.getElementById("tabPanels");
const initialized = {};

DATA.tabs.forEach((tab, idx) => {
  const btn = document.createElement("button");
  btn.textContent = tab.label;
  btn.addEventListener("click", () => showTab(idx));
  nav.appendChild(btn);

  const panel = document.createElement("div");
  panel.id = `panel-${idx}`;
  panel.style.display = "none";
  panel.innerHTML = panelHtml(tab, idx);
  panels.appendChild(panel);
});

function showTab(idx) {
  Array.from(nav.children).forEach((b, i) => b.classList.toggle("active", i === idx));
  Array.from(panels.children).forEach((p, i) => p.style.display = i === idx ? "" : "none");
  if (!initialized[idx]) {
    renderPanelCharts(DATA.tabs[idx], idx);
    initialized[idx] = true;
  }
}

showTab(0);
</script>
<script>
// Auto-reload cuando hay una build mas nueva publicada -- el dashboard se comparte como link
// (y como icono "agregar a inicio" en celulares) a las 10 franquicias, no podemos depender de que
// alguien fuerce un refresh manual. Re-descarga este mismo HTML con cache:'no-store' cada 90s
// mientras la pestana esta visible, y ademas al volver a primer plano (cubre el caso del icono de
// pantalla de inicio que reusa el mismo WebView), y compara el generated_at embebido via regex
// (evita crear un archivo aparte para no duplicar la fuente de verdad).
(function() {
  var CHECK_MS = 90000;
  var RE_GENERATED_AT = /"generated_at":\s*"([^"]+)"/;
  function checkVersion() {
    if (document.hidden) return;
    fetch(location.pathname + "?_=" + Date.now(), {cache: "no-store"})
      .then(function(r) { return r.text(); })
      .then(function(html) {
        var m = html.match(RE_GENERATED_AT);
        if (m && m[1] !== DATA.generated_at) {
          console.log("Dashboard: nueva version detectada (" + DATA.generated_at + " -> " + m[1] + "), recargando...");
          location.reload();
        }
      })
      .catch(function(e) { /* sin conexion -- no hacer nada */ });
  }
  setInterval(checkVersion, CHECK_MS);
  document.addEventListener("visibilitychange", function() { if (!document.hidden) checkVersion(); });
})();
</script>
